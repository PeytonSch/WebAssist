<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Debug Hub update</title>
<script>
  // Before first paint, so the window never flashes the wrong theme.
  (() => {
    const t = new URLSearchParams(location.search).get('theme');
    document.documentElement.dataset.theme = t === 'dark' || t === 'light' ? t : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  })();
</script>
<style>
  /* The app's tokens (src/ui/styles.css), so this window looks like the rest of Debug Hub. */
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f9fafb; --border: #e4e7ec; --border-strong: #d0d5dd;
    --text: #101828; --text-2: #475467; --muted: #8a94a6; --accent: #4f46e5; --accent-soft: #eef2ff; --on-accent: #ffffff;
    --hover: #f3f4f7; --selected: #eef2ff;
    --error: #d92d20; --error-soft: #fef3f2; --warn: #b54708; --warn-soft: #fffaeb; --ok: #067647; --ok-soft: #ecfdf3;
    --add: #1a7f37; --del: #cf222e;
    --add-line: #e6ffec; --add-gutter: #ccffd8; --add-word: #abf2bc;
    --del-line: #ffebe9; --del-gutter: #ffd7d5; --del-word: #ffb8b0;
    --hunk: #eef2ff; --hunk-text: #4f46e5;
    --tag-new: #4f46e5; --tag-new-bg: #eef2ff; --tag-fix: #b54708; --tag-fix-bg: #fff6e5; --tag-docs: #0e7490; --tag-docs-bg: #ecfbff;
    --tag-tests: #6d28d9; --tag-tests-bg: #f4f0ff; --tag-improved: #067647; --tag-improved-bg: #ecfdf3;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
    --glow: rgba(79, 70, 229, 0.16);
    --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0b0d12; --surface: #11141b; --surface-2: #161a23; --border: #222734; --border-strong: #323949;
    --text: #e7e9ee; --text-2: #a9b1c2; --muted: #6f788b; --accent: #818cf8; --accent-soft: #1d2040; --on-accent: #0b0d12;
    --hover: #181c26; --selected: #1d2040;
    --error: #f97066; --error-soft: #2a1516; --warn: #fdb022; --warn-soft: #2a2010; --ok: #47cd89; --ok-soft: #0f2a1d;
    --add: #4ac26b; --del: #f47067;
    --add-line: rgba(46, 160, 67, 0.13); --add-gutter: rgba(46, 160, 67, 0.22); --add-word: rgba(46, 160, 67, 0.42);
    --del-line: rgba(248, 81, 73, 0.12); --del-gutter: rgba(248, 81, 73, 0.2); --del-word: rgba(248, 81, 73, 0.4);
    --hunk: #161a2e; --hunk-text: #a5b0fb;
    --tag-new: #a5b0fb; --tag-new-bg: #1d2040; --tag-fix: #fdb022; --tag-fix-bg: #2a2010; --tag-docs: #67d4ea; --tag-docs-bg: #0c2630;
    --tag-tests: #c4a8ff; --tag-tests-bg: #241a3d; --tag-improved: #47cd89; --tag-improved-bg: #0f2a1d;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    --glow: rgba(129, 140, 248, 0.16);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--surface); color: var(--text);
    font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; cursor: default;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ── Title bar ─────────────────────────────── */
  .titlebar {
    flex: none; height: 38px; display: flex; align-items: center; gap: 9px; padding: 0 6px 0 14px;
    -webkit-app-region: drag; user-select: none; border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .titlebar .mark { width: 18px; height: 18px; border-radius: 5px; background: var(--accent); position: relative; flex: none; }
  .titlebar .mark i { position: absolute; left: 4px; height: 2px; border-radius: 1px; background: var(--on-accent); }
  .titlebar .mark i:nth-child(1) { top: 5px; width: 10px; }
  .titlebar .mark i:nth-child(2) { top: 8px; width: 6px; }
  .titlebar .mark i:nth-child(3) { top: 11px; width: 8px; }
  .titlebar .name { font-size: 12.5px; font-weight: 600; color: var(--text-2); }
  .titlebar .spacer { flex: 1; }
  .close {
    -webkit-app-region: no-drag; width: 34px; height: 28px; border: 0; border-radius: 6px; background: none;
    color: var(--muted); font-size: 16px; line-height: 1; cursor: pointer; display: grid; place-items: center;
  }
  .close:hover { background: var(--error); color: #fff; }

  /* ── Hero ─────────────────────────────────── */
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .hero {
    flex: none; position: relative; overflow: hidden; display: flex; align-items: center; gap: 18px; padding: 22px 24px 18px;
    background:
      radial-gradient(600px 180px at 0% 0%, var(--glow), transparent 70%),
      radial-gradient(500px 160px at 100% 0%, var(--glow), transparent 75%),
      var(--surface);
  }
  .logo { width: 56px; height: 56px; border-radius: 15px; background: var(--accent); position: relative; flex: none; box-shadow: 0 6px 20px var(--glow); }
  .logo i { position: absolute; left: 14px; height: 5px; border-radius: 3px; background: var(--on-accent); transform-origin: left center; animation: bar 1.5s ease-in-out 2; }
  .logo i:nth-child(1) { top: 16px; width: 28px; }
  .logo i:nth-child(2) { top: 26px; width: 18px; animation-delay: 0.15s; }
  .logo i:nth-child(3) { top: 36px; width: 23px; animation-delay: 0.3s; }
  @keyframes bar { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(0.55); } }
  .hero-text { flex: 1; min-width: 0; }
  .eyebrow { font-size: 11px; font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
  .hero h1 { margin: 2px 0 4px; font-size: 21px; font-weight: 700; letter-spacing: -0.015em; }
  .hero p { margin: 0; color: var(--text-2); }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px;
    border: 1px solid var(--border); background: var(--surface); font-size: 12px; font-weight: 550; color: var(--text-2);
    font-variant-numeric: tabular-nums; white-space: nowrap; box-shadow: var(--shadow);
  }
  .chip .plus { color: var(--add); }
  .chip .minus { color: var(--del); }
  .chip.sha { font-family: var(--mono); font-size: 11.5px; font-weight: 500; }
  .chip.sha .arrow { color: var(--muted); }
  .chip.sha b { color: var(--accent); font-weight: 600; }

  /* ── Banners ───────────────────────────────── */
  .banners { flex: none; display: flex; flex-direction: column; gap: 8px; padding: 0 24px 14px; }
  .banners:empty { display: none; }
  .banner { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border-radius: 8px; border: 1px solid; font-size: 12.5px; }
  .banner .ic { flex: none; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; margin-top: 1px; }
  .banner.info { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 28%, transparent); }
  .banner.info .ic { background: var(--accent); color: var(--on-accent); }
  .banner.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
  .banner.warn .ic { background: var(--warn); color: var(--surface); }
  .banner b { font-weight: 650; }
  .banner code { font-family: var(--mono); font-size: 11.5px; }

  /* ── Tabs ─────────────────────────────────── */
  .tabs { flex: none; display: flex; gap: 2px; padding: 0 20px; border-bottom: 1px solid var(--border); }
  .tab {
    position: relative; height: 38px; padding: 0 12px; border: 0; background: none; cursor: pointer;
    color: var(--text-2); font-weight: 550; display: inline-flex; align-items: center; gap: 7px;
  }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--text); }
  .tab[aria-selected="true"]::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent); }
  .count { min-width: 20px; height: 18px; padding: 0 6px; border-radius: 9px; background: var(--hover); color: var(--text-2); font-size: 11px; font-weight: 600; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
  .tab[aria-selected="true"] .count { background: var(--accent-soft); color: var(--accent); }
  .tabs .summary { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .pane { flex: 1; min-height: 0; display: none; background: var(--bg); }
  .pane.on { display: flex; }

  /* ── What's new ─────────────────────────────── */
  .commits { flex: 1; overflow-y: auto; padding: 16px 24px 22px; }
  .commit {
    position: relative; margin: 0 0 8px 22px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface);
    box-shadow: var(--shadow); animation: rise 0.35s ease-out both;
  }
  .commit::before { content: ""; position: absolute; left: -16px; top: 18px; width: 9px; height: 9px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
  .commit::after { content: ""; position: absolute; left: -11px; top: 31px; bottom: -10px; width: 1px; background: var(--border-strong); }
  .commit:last-child::after { display: none; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .commit-head { display: flex; gap: 12px; align-items: flex-start; width: 100%; padding: 11px 14px; border: 0; background: none; text-align: left; cursor: pointer; border-radius: 10px; }
  .commit-head:hover { background: var(--hover); }
  .commit.open .commit-head { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .commit-main { flex: 1; min-width: 0; }
  .subject { font-size: 13.5px; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
  .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; margin-top: 5px; color: var(--muted); font-size: 12px; }
  .avatar { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 8.5px; font-weight: 700; color: #fff; flex: none; }
  .who { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); }
  .meta .sha { font-family: var(--mono); font-size: 11px; }
  .commit-head .tag { min-width: 68px; justify-content: center; }
  .tag { display: inline-flex; align-items: center; height: 19px; padding: 0 7px; border-radius: 5px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.02em; flex: none; margin-top: 1px; }
  .tag.new { color: var(--tag-new); background: var(--tag-new-bg); }
  .tag.fix { color: var(--tag-fix); background: var(--tag-fix-bg); }
  .tag.docs { color: var(--tag-docs); background: var(--tag-docs-bg); }
  .tag.tests { color: var(--tag-tests); background: var(--tag-tests-bg); }
  .tag.improved { color: var(--tag-improved); background: var(--tag-improved-bg); }
  .delta { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; font-size: 11.5px; font-variant-numeric: tabular-nums; font-family: var(--mono); padding-top: 1px; }
  .delta .nums { display: flex; gap: 6px; }
  .plus { color: var(--add); }
  .minus { color: var(--del); }
  .nums { display: inline-flex; gap: 6px; font-family: var(--mono); font-size: 11.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .blocks { display: inline-flex; gap: 2px; }
  .blocks i { width: 7px; height: 7px; border-radius: 1.5px; background: var(--border-strong); }
  .blocks i.add { background: var(--add); }
  .blocks i.del { background: var(--del); }
  .chev { flex: none; color: var(--muted); transition: transform 0.15s; margin-top: 2px; font-size: 11px; }
  .commit.open .chev { transform: rotate(90deg); }
  .commit-body { display: none; border-top: 1px solid var(--border); }
  .commit.open .commit-body { display: block; }
  .message { padding: 10px 18px 4px 16px; color: var(--text-2); font-size: 12.5px; line-height: 1.6; overflow-wrap: anywhere; max-width: 760px; user-select: text; cursor: text; }
  .message p { margin: 0 0 8px; }
  .message ul { margin: 0 0 8px; padding-left: 18px; }
  .message li { margin: 0 0 4px; }
  .message li::marker { color: var(--accent); }
  .message pre { margin: 0 0 8px; padding: 8px 10px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--border); font: 11.5px/1.5 var(--mono); white-space: pre-wrap; }
  .filelist { list-style: none; margin: 0; padding: 6px 6px 8px; }
  .filelist li > button {
    width: 100%; display: flex; align-items: center; gap: 10px; padding: 5px 10px; border: 0; border-radius: 6px;
    background: none; text-align: left; cursor: pointer; font-size: 12px;
  }
  .filelist li > button:hover { background: var(--hover); }
  .filelist li > button[aria-expanded="true"] { background: var(--selected); }
  .filelist .path { flex: 1; min-width: 0; font-family: var(--mono); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .filelist .path bdi { direction: ltr; unicode-bidi: isolate; }
  .filelist .path .dir { color: var(--muted); }
  .inline-diff { margin: 4px 4px 8px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .empty { padding: 40px 20px; text-align: center; color: var(--muted); }

  /* ── Files changed ─────────────────────────── */
  .files { width: 300px; flex: none; overflow-y: auto; border-right: 1px solid var(--border); background: var(--surface); padding: 8px 6px 16px; }
  .group-name { display: flex; align-items: center; gap: 6px; padding: 10px 10px 4px; font-size: 11px; font-weight: 650; color: var(--muted); font-family: var(--mono); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .file {
    width: 100%; display: flex; align-items: center; gap: 8px; padding: 5px 10px 5px 14px; border: 0; border-radius: 6px;
    background: none; cursor: pointer; text-align: left; font-size: 12px;
  }
  .file:hover { background: var(--hover); }
  .file[aria-selected="true"] { background: var(--selected); }
  .file[aria-selected="true"] .fname { color: var(--accent); font-weight: 600; }
  .fname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 11.5px; }
  .file .nums { font-family: var(--mono); font-size: 10.5px; display: flex; gap: 5px; font-variant-numeric: tabular-nums; }
  .viewer { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .viewer-head { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .viewer-head .vpath { flex: 1; min-width: 0; font-family: var(--mono); font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .viewer-head .badge { font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 5px; }
  .badge.new { color: var(--add); background: var(--add-line); }
  .badge.deleted { color: var(--del); background: var(--del-line); }
  .viewer-body { flex: 1; min-height: 0; overflow: auto; background: var(--surface); }

  /* ── Diff ─────────────────────────────────── */
  .diff { width: 100%; border-collapse: collapse; font: 12px/1.6 var(--mono); tab-size: 4; }
  .diff td { padding: 0; vertical-align: top; }
  .diff .ln { width: 1%; min-width: 44px; padding: 0 8px; text-align: right; color: var(--muted); user-select: none; font-size: 11px; white-space: nowrap; }
  .diff .sign { width: 18px; padding-left: 6px; user-select: none; color: var(--muted); }
  .diff .code { white-space: pre; padding: 0 16px 0 4px; }
  .diff tr.add td { background: var(--add-line); }
  .diff tr.add .ln { background: var(--add-gutter); }
  .diff tr.add .sign { color: var(--add); }
  .diff tr.del td { background: var(--del-line); }
  .diff tr.del .ln { background: var(--del-gutter); }
  .diff tr.del .sign { color: var(--del); }
  .diff tr.add mark { background: var(--add-word); color: inherit; border-radius: 2px; }
  .diff tr.del mark { background: var(--del-word); color: inherit; border-radius: 2px; }
  .diff tr.hunk td { background: var(--hunk); color: var(--hunk-text); padding-top: 3px; padding-bottom: 3px; font-size: 11.5px; }
  .diff tr.hunk .ctx { color: var(--text-2); margin-left: 8px; }
  .diff tr.note td { color: var(--muted); font-style: italic; }
  .diff-msg { padding: 28px 20px; text-align: center; color: var(--muted); }
  .diff-msg .btn { margin-top: 10px; }
  .loading { display: inline-block; width: 120px; height: 3px; border-radius: 2px; background: var(--border); position: relative; overflow: hidden; }
  .loading::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; background: var(--accent); border-radius: 2px; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { left: -40%; } 100% { left: 100%; } }

  /* ── Footer ───────────────────────────────── */
  footer { flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 16px 12px 24px; border-top: 1px solid var(--border); background: var(--surface); }
  footer .note { flex: 1; min-width: 0; color: var(--muted); font-size: 12px; }
  footer .note code { font-family: var(--mono); font-size: 11.5px; color: var(--text-2); }
  .btn {
    height: 34px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface);
    font-weight: 600; cursor: pointer; box-shadow: var(--shadow); white-space: nowrap;
  }
  .btn:hover { background: var(--hover); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); box-shadow: 0 2px 10px var(--glow); }
  .btn-primary:hover { background: var(--accent); filter: brightness(1.08); }
  .btn-primary:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent); outline-offset: 1px; }
  .btn-primary .kbd { opacity: 0.7; font-weight: 500; margin-left: 6px; font-size: 11px; }
  .btn.busy { pointer-events: none; opacity: 0.85; }

  /* ── Message windows (up to date, could not update) ── */
  body.message main { justify-content: center; }
  .msg { display: flex; gap: 16px; padding: 22px 24px 18px; }
  .msg .icon { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 21px; font-weight: 700; }
  .msg .icon.ok { background: var(--ok-soft); color: var(--ok); }
  .msg .icon.warn { background: var(--warn-soft); color: var(--warn); }
  .msg .icon.error { background: var(--error-soft); color: var(--error); }
  .msg h1 { margin: 2px 0 6px; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .msg p { margin: 0; color: var(--text-2); white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; cursor: text; }
  .msg .chip { margin-top: 12px; }
  .icon.ok { animation: pop 0.4s cubic-bezier(.2, 1.4, .4, 1) both; }
  @keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: none; opacity: 1; } }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <div class="titlebar">
    <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="name">Debug Hub</span>
    <span class="spacer"></span>
    <button class="close" id="close" title="Close (Esc)" aria-label="Close">✕</button>
  </div>
  <main id="main"></main>
  <footer id="footer"></footer>
  <script>/*__UPDATE_VIEW__*/</script>
</body>
</html>
