<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Debug Hub</title>
<style>
  :root {
    --bg: #ffffff; --text: #101828; --muted: #667085; --track: #e4e7ec; --accent: #4f46e5;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11141b; --text: #e7e9ee; --muted: #8b93a7; --track: #262b38; --accent: #818cf8; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text);
    font: 13px/1.4 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; user-select: none; cursor: default;
    -webkit-app-region: drag; overflow: hidden;
  }
  .logo { width: 72px; height: 72px; border-radius: 18px; background: var(--accent); position: relative; margin-bottom: 22px; }
  .logo i {
    position: absolute; left: 18px; height: 6px; border-radius: 3px; background: #fff;
    transform-origin: left center; animation: bar 1.5s ease-in-out infinite;
  }
  @media (prefers-color-scheme: dark) { .logo i { background: #11141b; } }
  .logo i:nth-child(1) { top: 21px; width: 36px; }
  .logo i:nth-child(2) { top: 33px; width: 24px; animation-delay: 0.15s; }
  .logo i:nth-child(3) { top: 45px; width: 30px; animation-delay: 0.3s; }
  @keyframes bar { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(0.55); } }
  h1 { margin: 0 0 26px; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
  .track { width: 200px; height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; position: relative; }
  .fill { height: 100%; border-radius: 2px; background: var(--accent); width: 0; transition: width 0.2s ease-out; }
  .track.busy .fill { width: 40%; position: absolute; animation: slide 1.1s ease-in-out infinite; transition: none; }
  @keyframes slide { 0% { left: -40%; } 100% { left: 100%; } }
  #status { margin-top: 14px; color: var(--muted); min-height: 18px; font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { .logo i, .track.busy .fill { animation: none; } .track.busy .fill { left: 30%; } }
</style>
</head>
<body>
  <div class="logo" aria-hidden="true"><i></i><i></i><i></i></div>
  <h1>Debug Hub</h1>
  <div class="track busy" id="track"><div class="fill" id="fill"></div></div>
  <div id="status" role="status">Starting…</div>
  <script>
    const track = document.getElementById('track');
    const fill = document.getElementById('fill');
    const status = document.getElementById('status');
    window.splash.onStatus((s) => {
      const determinate = typeof s.percent === 'number';
      track.classList.toggle('busy', !determinate);
      fill.style.width = determinate ? Math.max(2, s.percent) + '%' : '';
      status.textContent = determinate ? s.text + ' · ' + s.percent + '%' : s.text;
    });
  </script>
</body>
</html>
