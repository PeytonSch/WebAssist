name: Release

# Push a tag like v0.2.0 to publish a release. Each release carries:
#   latest.json + debug-hub-payload-<version>.json.gz   what installed apps download on launch
#   DebugHub-<version>-win-setup.exe                    Windows installer, for a first install
#   DebugHub-<version>-mac.dmg                          macOS installer, for a first install
# Installed apps read https://github.com/<repo>/releases/latest/download/latest.json, so the
# repository must be public. A manual run builds without publishing.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Published first and on its own, so installed apps get the update even if an installer
  # build fails.
  payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The app compares this version to the latest release, so it must match the tag.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - run: npm run typecheck
      - run: npm test
      - run: npm run release:assets
      - uses: actions/upload-artifact@v4
        with:
          name: payload
          path: release/*
      - name: Publish payload
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Debug Hub ${{ github.ref_name }}
          files: |
            release/latest.json
            release/*.json.gz

  installer:
    needs: payload
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: out/*-win-setup.exe
          - os: macos-latest
            script: dist:mac
            files: out/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}
      - name: Publish installer
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Debug Hub ${{ github.ref_name }}
          files: ${{ matrix.files }}

  # The unit tests have only ever run on Linux. This shows whether they hold on Windows, the
  # platform the app is mainly used on, without holding up the release if they do not.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
